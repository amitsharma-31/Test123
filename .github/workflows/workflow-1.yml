name: worklow number 1
on: push
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: First step
        run: echo "This is our first step within our job 1 of workflow 1"
      - name: Clone my repo
        uses: actions/checkout@v7
      
      - name: display files
        run: ls -l

      - name: use terraform action
        uses: hashicorp/setup-terraform@v4
      
      - name: terraform initialize
        run: terraform init

      - name: terraform plan
        run: terraform plan
