name: Concurrency Example
on: push
jobs:
  test-job-1:
    concurrency:
      group: test-group
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: name of the step1
        run: echo test message
      - name: name of the step2
        run: echo test message22
      - name: Sleep
        run: sleep 600
