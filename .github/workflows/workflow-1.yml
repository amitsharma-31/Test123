name: CI JOB
on: push
jobs:
  first_CI_job:
    runs-on: ubuntu-latest
    steps:
      - name: First step
        run: echo "This is our first step within our job 1 of workflow 1"
      - name: Clone my repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Terraform linter
        uses: terraform-linters/setup-tflint@v6

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
