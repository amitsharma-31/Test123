name: worklow number 1
on: push
jobs:
  first_CI_job:
    runs-on: ubuntu-latest
    steps:
      - name: First step
        run: echo "This is our first step within our job 1 of workflow 1"
      - name: Clone my repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Terraform linter
        uses: terraform-linters/setup-tflint@v6

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init

  Second_CD_job:
    runs-on: ubuntu-latest
    steps:
      - name: Clone my repo
        uses: actions/checkout@v7

      - name: display files
        run: ls -l

      - name: use terraform action
        uses: hashicorp/setup-terraform@v4
      
      - name: terraform initialize
        run: terraform init

      - name: terraform plan
        run: terraform plan