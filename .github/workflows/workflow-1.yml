name: Example if expression
on: push
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Some test ${{ github.ref }}
        run: ls -ltra

  deploy-job:
    if: ${{ github.ref == 'refs/heads/main' }}     ##github.ref is context as explained in previous topic
    runs-on: ubuntu-latest
    steps:
      - name: Clone my repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Some test
        run: cat README.md
